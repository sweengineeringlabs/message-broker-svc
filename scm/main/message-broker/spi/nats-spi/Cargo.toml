[package]
name         = "message-broker-pattern-nats-spi"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-svc"
rust-version = "1.98"
description  = "message-broker-pattern NATS SPI: async-nats-backed MessageBroker implementation. Extracted from edge-runtime's runtime-message-broker-nats-spi per edge-message-broker#6."
keywords     = ["message-broker", "nats", "spi", "async", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "adapter"
service_type     = "message-broker"

[lib]
name = "message_broker_pattern_nats_spi"
path = "src/lib.rs"

[dependencies]
message-broker-pattern-contract = { git = "https://github.com/sweengineeringlabs/message-broker-pattern.git", branch = "dev" }
message-broker-pattern-core     = { git = "https://github.com/sweengineeringlabs/message-broker-pattern.git", branch = "dev" }
futures    = "0.3"
tokio      = { version = "1.52", features = ["sync", "rt", "time"] }
async-nats = "0.49"

[dev-dependencies]
tokio   = { version = "1.52", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
bytes   = "1"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
