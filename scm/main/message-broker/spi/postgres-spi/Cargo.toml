[package]
name         = "message-broker-svc-postgres-spi"
version      = "0.2.1"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-svc"
rust-version = "1.98"
description  = "message-broker-svc Postgres SPI: pgmq-backed MessageBroker implementation. Extracted from edge-runtime's runtime-message-broker-postgres-spi per edge-message-broker#6."
keywords     = ["message-broker", "postgres", "pgmq", "spi", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "adapter"
service_type     = "message-broker"

[lib]
name = "message_broker_svc_postgres_spi"
path = "src/lib.rs"

[dependencies]
message-broker-pattern = { version = "0.3.0", git = "https://github.com/sweengineeringlabs/message-broker-pattern.git", tag = "v0.3.0" }
configbuilder = "0.8"
serde      = { version = "1.0", features = ["derive"] }
futures    = "0.3"
tokio      = { version = "1.52", features = ["sync", "rt", "time", "net"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1.0"
base64     = "0.22"
serde_json = "1.0"

[dev-dependencies]
tokio    = { version = "1.52", features = ["rt-multi-thread", "macros"] }
futures  = "0.3"
tempfile = "3.27"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
