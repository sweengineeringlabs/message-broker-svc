[package]
name         = "message-broker-svc-spi-shared"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-svc"
rust-version = "1.98"
description  = "message-broker-svc spi/shared: implementation code shared by more than one *-spi backend. Extends message-broker-pattern's Validator trait itself (ValidatorExt) rather than exposing free functions or a separate helper struct -- program to the interface, not to the consumer."
keywords     = ["message-broker", "spi", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "lib"
service_type     = "message-broker"

[lib]
name = "message_broker_svc_spi_shared"
path = "src/lib.rs"

[dependencies]
message-broker-pattern = "0.1.1"

[dev-dependencies]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
