[package]
name         = "message-broker-svc-core"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-svc"
rust-version = "1.98"
description  = "message-broker-svc core: generic implementation code shared by every *-spi backend, exploiting message-broker-pattern's own trait bounds directly. Mirrors ledger's own adapter/replication crate (generic over LedgerPayload, never inside ledger-base-port)."
keywords     = ["message-broker", "core", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "lib"
service_type     = "message-broker"

[lib]
name = "message_broker_svc_core"
path = "src/lib.rs"

[dependencies]
message-broker-pattern = { git = "https://github.com/sweengineeringlabs/message-broker-pattern.git", branch = "dev" }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
